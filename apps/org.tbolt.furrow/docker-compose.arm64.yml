name: furrow

services:
  furrow:
    image: ghcr.io/tboltsp951/zimaos-furrow:latest@sha256:2ad8531818551d241535ae1a18be36183232cf36ec980e27c475bbd545258adc
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8191"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: furrow
x-casaos:
  id: org.tbolt.furrow
  main: furrow
  icon: https://tboltsp951.github.io/zimaos-store/apps/org.tbolt.furrow/assets/icon.svg
  title:
    en_US: Furrow
  index: /
  port_map: "8191"
  version: "1.1.0"
