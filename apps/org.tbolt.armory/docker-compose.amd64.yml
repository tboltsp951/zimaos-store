name: armory

services:
  armory:
    image: ghcr.io/tboltsp951/zimaos-armory:latest@sha256:8abf8941a0db9ef5d7e1f28bae5fca123d66d0aaddc87e032af2c18a30c1f5d2
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8196"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: armory
x-casaos:
  id: org.tbolt.armory
  main: armory
  icon: https://cdn.jsdelivr.net/gh/tboltsp951/zimaos-store@gh-pages/apps/org.tbolt.armory/assets/icon.svg
  title:
    en_US: Armory
  index: /
  port_map: "8196"
  version: "1.0.0"
