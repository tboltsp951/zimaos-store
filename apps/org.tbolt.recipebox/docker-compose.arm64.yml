# Recipe Box for ZimaOS / CasaOS.
name: recipe-box

services:
  recipe-box:
    image: ghcr.io/tboltsp951/zimaos-recipe-box:1.0.7@sha256:83eccda60d080799f0be951b933ad25489d997be41500e9edba6ad86109588aa
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8197"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
      RECIPEBOX_TOKEN: ""
    container_name: recipe-box
x-casaos:
  id: org.tbolt.recipebox
  main: recipe-box
  icon: https://tboltsp951.github.io/zimaos-store/apps/org.tbolt.recipebox/assets/icon.svg
  title:
    en_US: Recipe Box
  index: /
  port_map: "8197"
  version: "1.0.7"
