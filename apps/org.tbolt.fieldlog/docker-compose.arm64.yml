name: field-log

services:
  field-log:
    image: ghcr.io/tboltsp951/zimaos-field-log:latest@sha256:7b48b68ccea41548b1b54ec0934937789c9b7925f2d86a8767ade72fc729d142
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8195"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: field-log
x-casaos:
  id: org.tbolt.fieldlog
  main: field-log
  icon: https://cdn.jsdelivr.net/gh/tboltsp951/zimaos-store@gh-pages/apps/org.tbolt.fieldlog/assets/icon.svg
  title:
    en_US: Field Log
  index: /
  port_map: "8195"
  version: "1.0.0"
