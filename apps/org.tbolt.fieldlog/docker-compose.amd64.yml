name: field-log

services:
  field-log:
    image: ghcr.io/tboltsp951/zimaos-field-log:latest@sha256:688eff2f093f6bf1deb4cc7b702379b5041eb597aa0cd4cd6326db1a4bfc851a
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8195"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: field-log
x-casaos:
  id: org.tbolt.fieldlog
  main: field-log
  icon: https://cdn.jsdelivr.net/gh/tboltsp951/zimaos-store@gh-pages/apps/org.tbolt.fieldlog/assets/icon.svg
  title:
    en_US: Field Log
  index: /
  port_map: "8195"
  version: "1.0.0"
