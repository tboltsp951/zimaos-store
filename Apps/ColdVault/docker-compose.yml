name: cold-vault

services:
  cold-vault:
    image: ghcr.io/tboltsp951/zimaos-crypto-vault:latest
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8193"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: cold-vault
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: "Cold Vault web UI"
      volumes:
        - container: /data
          description:
            en_US: "Crypto holdings, wallet locations, and portfolio data"
    labels:
      icon: "https://raw.githubusercontent.com/tboltsp951/zimaos-crypto-vault/main/Apps/ColdVault/icon.svg"

x-casaos:
  id: org.tbolt.coldvault
  architectures:
    - amd64
    - arm64
  main: cold-vault
  author: tbolt
  category: Finance
  description:
    en_US: A personal cold-vault portfolio for crypto holdings. Track coins across multiple locations (exchanges, cold wallets, hardware), with live CoinGecko pricing, manual balance entry, and an AI-free, server-side autosave to your NAS. Data lives on your NAS.
  developer: tbolt
  icon: "icon.svg"
  screenshot_link:
    - "screenshot.svg"
  tagline:
    en_US: Track crypto holdings across locations, self-hosted
  thumbnail: "thumbnail.svg"
  tips:
    before_install:
      en_US: |
        ## Cold Vault

        Data (coin holdings, wallet locations, portfolio, AI-free server-side autosave) is stored on your ZimaOS disk at `/DATA/AppData/cold-vault/`, so it survives container rebuilds and is shared across every browser on your network.
  title:
    en_US: Cold Vault
  index: /
  port_map: "8193"
  version: "1.1.0"
  update_at: "2026-10-06"
  release_notes:
    en_US: |-
      - New Tracked coins manager in Settings: search CoinGecko by name or symbol, or add by CoinGecko ID, and any coin you hold gets its ID, name and logo picked up automatically for live pricing.
      - Remove coins you don't track; coins still used by a holding are protected.
      - Custom coins are saved with your data and included in export/import.
  website: "https://github.com/tboltsp951/zimaos-crypto-vault"
  repo: "https://github.com/tboltsp951/zimaos-crypto-vault"
  support: "https://github.com/tboltsp951/zimaos-crypto-vault/issues"
