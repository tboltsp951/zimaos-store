name: field-log

services:
  field-log:
    image: ghcr.io/tboltsp951/zimaos-field-log:latest
    pull_policy: always
    network_mode: bridge
    ports:
      - target: 8080
        published: "8195"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: field-log
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: "Field Log web UI"
      volumes:
        - container: /data
          description:
            en_US: "Harvests, catches, sits, spots, gear, and freezer inventory"
    labels:
      icon: "https://raw.githubusercontent.com/tboltsp951/zimaos-field-log/main/Apps/FieldLog/icon.svg"

x-casaos:
  id: org.tbolt.fieldlog
  architectures:
    - amd64
    - arm64
  main: field-log
  author: tbolt
  category: Productivity
  description:
    en_US: A lean, local-first field log for hunters and anglers. Track harvests, catches, and time afield; keep a freezer inventory cut by cut; score your stands, blinds, and launches by hit rate; and hold your gear list, licenses, and tags in one place. Data lives on your NAS.
  developer: tbolt
  icon: "icon.svg"
  screenshot_link:
    - "screenshot.svg"
  tagline:
    en_US: What you took, what you caught, where it came from
  thumbnail: "thumbnail.svg"
  tips:
    before_install:
      en_US: |
        ## Field Log

        Data (harvests, catches, sits, spots, gear, freezer inventory, licenses and tags) is stored on your ZimaOS disk at `/DATA/AppData/field-log/`, so it survives container rebuilds and is shared across every browser on your network.
  title:
    en_US: Field Log
  index: /
  port_map: "8195"
  version: "1.0.0"
  update_at: "2026-09-06"
  release_notes:
    en_US: |-
      - Initial release: self-hosted harvest & catch log with on-NAS storage.
  website: "https://github.com/tboltsp951/zimaos-field-log"
  repo: "https://github.com/tboltsp951/zimaos-field-log"
  support: "https://github.com/tboltsp951/zimaos-field-log/issues"