name: reserve-ledger

services:
  reserve-ledger:
    image: ghcr.io/tboltsp951/zimaos-reserve-ledger:latest
    network_mode: bridge
    ports:
      - target: 8080
        published: "8192"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID
        target: /data
    environment:
      PORT: "8080"
      DATA_DIR: /data
    container_name: reserve-ledger
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: "Reserve Ledger web UI"
      volumes:
        - container: /data
          description:
            en_US: "Bullion ledger data (holdings, metals, prices, feeds, supplies)"
    labels:
      icon: "/Apps/ReserveLedger/icon.svg"

x-casaos:
  id: org.tbolt.reserve-ledger
  architectures:
    - amd64
    - "386"
    - arm64
    - arm
  main: reserve-ledger
  author: tbolt
  category: Finance
  description:
    en_US: A lean, local-first bullion ledger. Track coins, bars, and rounds, weigh and reconcile them against spot, refresh prices from live feeds or an AI agent, and log supplies. Data lives on your NAS.
  developer: tbolt
  icon: icon.svg
  screenshot_link:
    - screenshot.svg
  tagline:
    en_US: Your bullion ledger, self-hosted
  thumbnail: thumbnail.svg
  tips:
    before_install:
      en_US: |
        ## Reserve Ledger

        Data (holdings, custom metals, spot prices, feeds, supplies) is stored on your ZimaOS disk at `/DATA/AppData/reserve-ledger/`, so it survives container rebuilds and is shared across every browser on your network.
  title:
    en_US: Reserve Ledger
  index: /
  port_map: "8192"
  version: "1.0.0"
  update_at: "2026-08-11"
  release_notes:
    en_US: |-
      - Initial release: self-hosted bullion ledger with on-NAS storage.
  website: "https://github.com/tboltsp951/zimaos-reserve-ledger"
  repo: "https://github.com/tboltsp951/zimaos-reserve-ledger"
  support: "https://github.com/tboltsp951/zimaos-reserve-ledger/issues"
