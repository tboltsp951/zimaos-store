name: Build and Publish Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v2 dist
        id: build_v2
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Build Store Report

      - name: Upload build report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-v2-report
          path: out/build-v2-report.json
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: always() && steps.build_v2.outcome != 'success'
        shell: bash
        run: |
          echo "V2 store build failed. See build-v2-report artifact."
          exit 1

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Refresh jsDelivr cache
        run: |
          # jsDelivr caches a branch ref for up to a week. Purging only index.json
          # left each app's meta.json stale, so an app could show a category that
          # no longer exists and disappear from the store. Purge every published
          # file, not just the index.
          set -euo pipefail
          repo="${{ github.repository }}"
          # Give GitHub a moment to serve the new branch content, otherwise the
          # purge can re-cache the previous version.
          sleep 15
          purge() {
            curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
              "https://purge.jsdelivr.net/gh/${repo}@gh-pages/$1" >/dev/null 2>&1 || true
          }
          count=0
          while IFS= read -r f; do
            rel="${f#dist/}"
            [ "$rel" = ".nojekyll" ] && continue
            purge "$rel"
            count=$((count + 1))
          done < <(find dist -type f | sort)
          echo "Purged ${count} file(s) from jsDelivr."

      - name: Verify the CDN serves the new index
        run: |
          set -euo pipefail
          url="https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages/index.json"
          for attempt in 1 2 3 4 5; do
            body=$(curl -fsSL --max-time 20 "$url" || true)
            if echo "$body" | grep -q '"app_count"'; then
              echo "$body" | grep -o '"app_count":[0-9]*' || true
              echo "CDN is serving the store index."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::jsDelivr did not return the index yet; the store will catch up shortly."
