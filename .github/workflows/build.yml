name: Build and Publish Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v2 dist
        id: build_v2
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://cdn.jsdelivr.net/gh/${{ github.repository }}@gh-pages
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Build Store Report

      - name: Upload build report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-v2-report
          path: out/build-v2-report.json
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: always() && steps.build_v2.outcome != 'success'
        shell: bash
        run: |
          echo "V2 store build failed. See build-v2-report artifact."
          exit 1

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Refresh jsDelivr cache
        run: |
          # jsDelivr caches a branch ref for up to a week, so every published
          # file must be purged - not just index.json. Purging only the index
          # left each app's meta.json stale, so an app could advertise a
          # category that no longer exists and vanish from the store.
          #
          # A purge also races the deploy: jsDelivr re-fetches from GitHub
          # Pages, so purging before Pages serves the new build simply caches
          # the previous one. Wait for Pages to catch up, purge, then compare
          # the CDN against dist/ and purge again if it is still behind.
          set -euo pipefail
          repo="${{ github.repository }}"
          pages="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}"
          cdn="https://cdn.jsdelivr.net/gh/${repo}@gh-pages"

          purge() {
            curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
              "https://purge.jsdelivr.net/gh/${repo}@gh-pages/$1" >/dev/null 2>&1 || true
          }
          purge_all() {
            count=0
            while IFS= read -r f; do
              rel="${f#dist/}"
              [ "$rel" = ".nojekyll" ] && continue
              purge "$rel"
              count=$((count + 1))
            done < <(find dist -type f | sort)
            echo "Purged ${count} file(s) from jsDelivr."
          }

          for i in $(seq 1 24); do
            if curl -fsSL --max-time 20 "$pages/index.json" | cmp -s - dist/index.json; then
              echo "GitHub Pages is serving the new index."
              break
            fi
            if [ "$i" = "24" ]; then
              echo "::warning::Pages still serving an older index; purging anyway."
            fi
            sleep 5
          done

          purge_all

          stale_check() {
            curl -fsSL --max-time 20 "$cdn/index.json" 2>/dev/null | cmp -s - dist/index.json || return 1
            for meta in dist/apps/*/meta.json; do
              [ -e "$meta" ] || continue
              rel="apps/$(basename "$(dirname "$meta")")/meta.json"
              curl -fsSL --max-time 20 "$cdn/$rel" 2>/dev/null | cmp -s - "$meta" || return 1
            done
            return 0
          }

          for attempt in 1 2 3 4 5 6; do
            if stale_check; then
              echo "CDN matches the new build."
              exit 0
            fi
            echo "CDN still serving an older file (attempt ${attempt}); purging again."
            purge_all
            sleep 10
          done
          echo "::warning::jsDelivr is still serving older files; it will catch up shortly."
