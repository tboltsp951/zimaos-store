name: Build and Publish Store

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v2 dist
        id: build_v2
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          # Serve app files straight from GitHub Pages. jsDelivr caches a branch
          # ref for up to a week, and purging it races the Pages deploy, so it
          # repeatedly served a stale meta.json and hid apps from the store.
          # Pages sends Access-Control-Allow-Origin: * with a 10-minute TTL, so
          # updates appear on their own with no purge step.
          base-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json
          report-json: out/build-v2-report.json
          report-title: Build Store Report

      - name: Upload build report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-v2-report
          path: out/build-v2-report.json
          if-no-files-found: warn

      - name: Fail workflow if build failed
        if: always() && steps.build_v2.outcome != 'success'
        shell: bash
        run: |
          echo "V2 store build failed. See build-v2-report artifact."
          exit 1

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Verify the published store
        run: |
          # App files now come from Pages, so there is nothing to purge there.
          # This only waits for the deploy to appear and refreshes the jsDelivr
          # copy of index.json for clients still pointed at it (its base_url now
          # sends them to Pages for everything else).
          set -euo pipefail
          repo="${{ github.repository }}"
          pages="https://${{ github.repository_owner }}.github.io/${GITHUB_REPOSITORY#*/}"

          for i in $(seq 1 60); do
            if curl -fsSL --max-time 20 "$pages/index.json" | cmp -s - dist/index.json; then
              echo "GitHub Pages is serving the new index."
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::warning::Pages has not picked up the new index yet; it will within 10 minutes."
            fi
            sleep 5
          done

          for f in index.json store.json; do
            curl -fsSL --retry 3 --retry-delay 2 --max-time 20 \
              "https://purge.jsdelivr.net/gh/${repo}@gh-pages/$f" >/dev/null 2>&1 || true
          done
          echo "Refreshed the jsDelivr index copy."

          base=$(curl -fsSL --max-time 20 "$pages/index.json" | grep -o '"base_url"[^,}]*' | head -1 || true)
          echo "base_url: ${base}"
